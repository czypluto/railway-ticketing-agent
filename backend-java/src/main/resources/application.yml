server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: resv-backend
  autoconfigure:
    # 认证完全走自定义 JWT 过滤器链，不需要 Spring 自动配置的那个内存用户。
    # 不排除的话，每次启动都会生成一个随机密码的默认 user 并打印安全告警，容易误导。
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:resv}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:resv}
    password: ${MYSQL_PASSWORD:resv123}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16

app:
  jwt:
    # 与 Python 端共用，HS256，长度需 >= 32 字节
    secret: ${JWT_SECRET:resv-jwt-secret-change-me-0123456789abcdef}
    ttl-minutes: ${JWT_TTL_MINUTES:720}
  redis:
    prefix: "resv:"
  seckill:
    # 令牌桶参数（Redis+Lua，全局限流）
    qps: ${SECKILL_QPS:1000}
    burst: ${SECKILL_BURST:2000}
  circuit:
    # Redis 熔断：连续失败达阈值即打开，期间请求快速失败 503（不再逐个等超时）；
    # 冷却后转半开、放一个试探请求，成功则闭合。
    # 为什么是 5 次 / 10s：Lettuce 命令超时 3s，5 次失败约 15s 内触发——再拖线程池就顶不住了；
    # 冷却 10s 比常见的网络抖动尺度长一点，避免刚恢复就被打回。
    failure-threshold: ${CIRCUIT_FAILURE_THRESHOLD:5}
    open-millis: ${CIRCUIT_OPEN_MILLIS:10000}
  stream:
    # Stream key 由 RailwayKeys.orderStream() 统一维护（生产端与消费端共用同一常量），不放配置。
    # 此前配置里写的是 order-g/order-c1，代码里硬编码 rv-order-g/rv-order-c1，两边对不上且配置从未被读取。
    order-group: rv-order-g
    order-consumer: rv-order-c1

logging:
  level:
    com.group.resv: info
  pattern:
    # 带上 traceId（由 TraceIdFilter 从 X-Trace-Id 写入 MDC）。
    # 一次下单横跨 Python 与 Java，出问题时把同一个 id 拿去两边 grep 就能拼出完整链路；
    # `:-` 是缺省值——没经过 filter 的日志（启动期、健康检查）显示为空，不影响阅读。
    console: "%d{HH:mm:ss.SSS} %5p [%X{traceId:-}] [%15.15t] %-36.36logger{36} : %m%n"
